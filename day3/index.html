<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout & Positioning</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 p-6">

    <h1 class="text-blue-700 border-2 bg-gray-400 p-4 text-3xl m-5 text-center">Layout Mastery With Grid And Flex</h1>


    <!-- flex box -->
    <div class="flex justify-between items-center bg-gray-800 text-white p-4">
        <div>logo</div>
        <div class="flex gap-4">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <!-- grid -->

    <div class="mt-10 p-6 grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
        <div class="p-4 bg-gray-500 rounded-lg text-white">Card 1</div>
        <div class="p-4 bg-yellow-700 rounded-lg text-white">Card 2</div>
        <div class="p-4 bg-lime-500 rounded-lg text-white">Card 3</div>
    </div>


    
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 p-6 max-w-6xl">
    <!-- Card 1 -->
    <div class="bg-white shadow-lg rounded-lg p-4 hover:shadow-xl transition">
      <img src="https://picsum.photos/id/1015/400/250" alt="Product 1" class="rounded-md mb-4 w-full h-48 object-cover">
      <h2 class="text-xl font-bold mb-2">Mountain Escape</h2>
      <p class="text-gray-600 mb-4">A beautiful outdoor view for your inspiration.</p>
      <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        Buy Now
      </button>
    </div>

    <!-- Card 2 -->
    <div class="bg-white shadow-lg rounded-lg p-4 hover:shadow-xl transition">
      <img src="https://picsum.photos/id/1025/400/250" alt="Product 2" class="rounded-md mb-4 w-full h-48 object-cover">
      <h2 class="text-xl font-bold mb-2">Puppy Love</h2>
      <p class="text-gray-600 mb-4">Adorable puppy image to brighten your day.</p>
      <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        Buy Now
      </button>
    </div>

    <!-- Card 3 -->
    <div class="bg-white shadow-lg rounded-lg p-4 hover:shadow-xl transition">
      <img src="https://picsum.photos/id/1035/400/250" alt="Product 3" class="rounded-md mb-4 w-full h-48 object-cover">
      <h2 class="text-xl font-bold mb-2">City Lights</h2>
      <p class="text-gray-600 mb-4">A vibrant city view perfect for night lovers.</p>
      <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        Buy Now
      </button>
    </div>
  </div>
  
</body>
</html>
