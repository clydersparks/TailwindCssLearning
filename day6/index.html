<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Day 6 — Navigation</title>
</head>
<body class=" min-h-screen bg-gray-100 space-y-10 px-5">

  <h1 class="text-4xl font-bold text-sky-700 text-center bg-orange-900 text-white p-5">Day 6 — Navigation Bars And Re-Usable Components</h1>

  <nav class="px-7 py-4 flex justify-between items-center bg-orange-900 text-white shadow-md">
    <h1 class="text-3xl text-blue-500 font-bold">Brand</h1>

    <ul class="hidden md:flex flex space-x-6">
        <li><a class="hover:text-blue-400 transition duration-1000 text-xl" href="#">Home</a></li>
        <li><a class="hover:text-blue-400 transition duration-1000 text-xl" href="#">About</a></li>
        <li><a class="hover:text-blue-400 transition duration-1000 text-xl" href="#">Services</a></li>
        <li><a class="hover:text-blue-400 transition duration-1000 text-xl" href="#">Contacts</a></li>
    </ul>

    <button class="md:hidden text-3xl">
        ☰
    </button>
  </nav>

  <!-- Re usable buttons -->
  <button class="bg-sky-600 text-white text-xl px-4 py-2 rounded-lg hover:bg-sky-400 transition duration-500">Primary</button>
  <button class="bg-yellow-700 text-white text-xl px-4 py-2 rounded-lg hover:bg-yellow-500 transition duration-500">Secondary</button>


  <div class="max-w-sm rounded-xl overflow-hidden shadow-lg bg-white dark:bg-gray-800 p-3">
    <img src="male-avatar-smiling-portrait-of-a-cheerful-young-man-with-a-happy-smile-vector.jpg" class="w-full shadow-xl" />
    <div class="p-4">
        <h2 class="text-lg font-bold text-center">Card Title</h2>
        <p class="text-sm text-gray-600 dark:text-gray-300 mt-2">This is a reusable card component</p>
        <button class="mt-3 w-full bg-blue-600 text-white rounded-lg py-2 hover:bg-blue-700">Action</button>
    </div>
  </div>
</body>
</html>
