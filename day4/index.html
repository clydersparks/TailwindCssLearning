<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 - Landing Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

  <!-- Header / Navbar -->
  <header class="flex justify-between items-center p-4 bg-blue-800 text-white shadow-xl">
    
      <h1 class="text-3xl">Logo</h1>
      <nav class="p-4">
        <ul class="flex space-x-6">
          <li class="hover:text-black transition"><a href="#">Home</a></li>
          <li class="hover:text-black transition"><a href="#">About</a></li>
          <li class="hover:text-black transition"><a href="#">Services</a></li>
          <li class="hover:text-black transition"><a href="#">Contact</a></li>
        </ul>
      </nav>
      <button class="text-xl bg-white text-blue-700 px-3 py-2 rounded-lg border-0">Menu</button>
    
  </header>

  <!-- Hero Section -->
  <section class="grid grid-cols-1 md:grid-cols-2 p-5">
    
      <div class="border-1 border-solid border-yellow-800 flex justify-center flex-col items-center">
        <h2 class="text-4xl font-bold mb-4">Welcome</h2>
        <p class="m-5">Describe your product or service here.</p>
        <button class="bg-sky-800 text-white px-10 py-5 rounded-md mt-6">Get Started</button>
      </div>
      <div class="border-1 border-solid border-green-500">
        <img  class="padding-10 rounded-lg" src="https://picsum.photos/500/300" alt="Hero Image">
      </div>
   
  </section>

  <!-- Cards Section -->
  <section class="shadow-xl p-5 mt-5 grid gap-6 grid-cols-1 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
    
      <div class="bg-blue-800 p-5 h-64 text-center text-white">
        <h3 class="text-3xl mb-5">Card 1</h3>
        <p>Description for card 1</p>
      </div>
      <div class="bg-blue-800 p-5 h-64 text-center text-white">
        <h3 class="text-3xl mb-5">Card 2</h3>
        <p>Description for card 2</p>
      </div>
      <div class="bg-blue-800 p-5 h-64 text-center text-white">
        <h3 class="text-3xl mb-5">Card 3</h3>
        <p>Description for card 3</p>
      </div>
   
  </section>

</body>
</html>
