<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Day 1 Tailwind css</title>
</head>
<body>

    <!-- Colors -->
    
    <div class="bg-blue-500 text-white p-4 rounded">
        Hello Tailwind
    </div>

    <!--    
        bg-blue-500 → medium blue background
        text-white → white text
        p-4 → padding of 1rem
        rounded → rounded corners
    -->

    <!-- Spacing -->

    <div class="bg-green-500 text-white p-6 m-4 rounded-lg">
        This box has margin 6 and padding 4
    </div>


    <footer class="bg-blue-400 text-white p-5 rounded">&copy 2025</footer>
</body>
</html>
