<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Day 5 — Animations</title>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-gray-100 space-y-10">

  <h1 class="text-4xl font-bold">Day 5 — Animations</h1>

  <!-- Hover scaling  -->
  <button class="px-6 py-3 bg-blue-600 text-white rounded-lg transform transition duration-300 hover:scale-110">
    Hover me
  </button>

  <!-- Bounce -->
  <div class="w-16 h-16 bg-red-500 rounded-full animate-bounce"></div>

  <div class="w-16 bg-sky-800 text-white text-3xl flex items-center justify-center h-16 rounded-full"><h1 class="animate-bounce">R</h1></div>

  <!-- Ping effect -->
  <div class="relative flex">
    <span class="absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75 animate-ping"></span>
    <span class="relative inline-flex rounded-full h-16 w-16 bg-green-500"></span>
  </div>

</body>
</html>
